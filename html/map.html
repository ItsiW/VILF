{% extends "base.html" %}
{% block extra_head %}
<script src="https://unpkg.com/maplibre-gl@1.15.2/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@1.15.2/dist/maplibre-gl.css" rel="stylesheet" />

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Vegans In Love with Food",
  "alternateName": "V.I.L.F",
  "url": "{{ SITE_URL }}",
  "description": "{{ description }}",
  "potentialAction": {
    "@type": "SearchAction",
    "target": {
      "@type": "EntryPoint",
      "urlTemplate": "{{ SITE_URL }}/cuisines/{search_term_string}/"
    },
    "query-input": "required name=search_term_string"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Vegans In Love with Food",
    "url": "{{ SITE_URL }}",
    "logo": "{{ SITE_URL }}/favicon.png",
    "sameAs": [
      "https://www.instagram.com/VILF_SF/",
      "https://news.vilf.org"
    ]
  }
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Vegans In Love with Food",
  "alternateName": "V.I.L.F",
  "url": "{{ SITE_URL }}",
  "logo": "{{ SITE_URL }}/favicon.png",
  "description": "A collaborative and critical project that aims to showcase the ubiquity of good vegan food in the San Francisco Bay Area",
  "foundingLocation": {
    "@type": "Place",
    "name": "San Francisco Bay Area",
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 37.7749,
      "longitude": -122.4194
    }
  },
  "areaServed": {
    "@type": "Place",
    "name": "San Francisco Bay Area"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "email": "contact@vilf.org",
    "contactType": "customer service"
  },
  "sameAs": [
    "https://www.instagram.com/VILF_SF/",
    "https://news.vilf.org"
  ]
}
</script>
{% endblock %}
{% block content %}

<div id="map"></div>

<div id="label-legend" class="label-legend">
  <p class="label-legend-line"><span class="dot dot-phenomenal"></span><span class="mono-info-about phenomenal label-legend-text"> Phenomenal</span></p>
  <p class="label-legend-line"><span class="dot dot-good"></span><span class="mono-info-about good label-legend-text"> Good</span></p>
  <p class="label-legend-line"><span class="dot dot-sgfi"></span><span class="mono-info-about sgfi label-legend-text"> Something Okay</span></p>
  <p class="label-legend-line"><span class="dot dot-dnr"></span><span class="mono-info-about dnr label-legend-text"> Not Recommended</span></p>
</div>

<div id="state-legend" class="state-legend">
  <p class="state-legend-text"><b class="mono-info">Info:</b> click</p>
  <p class="state-legend-text"><b class="mono-info">Open:</b> again</p>
</div>

<script>
maplibregl.accessToken = "pk.eyJ1IjoidHJpc2NodGFuZGVyIiwiYSI6ImNsNmZwNXY2MDAxOWEzZG41b213NWJ2ZjIifQ.pMjBga8kA5XQuDw19WQ8TQ";

var map = new maplibregl.Map({
  container: "map",
  style: "mapbox://styles/mapbox/outdoors-v11",
  center: [-122.3556,37.7989],
  zoom: 11,
  hash: "spot",
});

// Add geolocate control to the map.
map.addControl(
    new maplibregl.GeolocateControl({
        positionOptions: {
            enableHighAccuracy: true
        },
        // When active the map will receive updates to the device's location as it changes.
        trackUserLocation: true,
        // Draw an arrow next to the location dot to indicate which direction the device is heading.
        showUserHeading: true
    })
);

// Add navigation control to the map
map.addControl(
  new maplibregl.NavigationControl({
    showZoom: false,
    visualizePitch: true
  })
);

function placeHTML(properties) {
  // don't show image if unavailable or on mobile
  if (properties.food_thumb_path == "null") {
    return `${_placeHTMLbody(properties)}`;
  }
  return `
    ${_placeHTMLimage(properties)}
    ${_placeHTMLbody(properties)}
  `;
}

function _placeHTMLimage(properties) {
  return `
    <img src="${properties.food_thumb_path }" alt="Vegan ${properties.cuisine} food at ${properties.name} in ${properties.area}, San Francisco Bay Area" class="food-image-popup">
  `;
}

function _placeHTMLbody(properties) {
  return `
  <div class="map-popup">
    <h3 class="name-popup">${properties.name}</h3>
    <div class="description-popup">
      <p class="popup"><b>${properties.cuisine}</b> food</p>
    </div>
    <p class="mono-info-popup">Taste: <b style="color: ${properties.taste_color}">${properties.taste_label}</b></p>
    <p class="mono-info-popup">Value: <b style="color: ${properties.value_color}">${properties.value_label}</b></p>
  </div>
  `;
}

// desktop click logic
// open in new window
function placeClickedDesktop(event) {
  var feature = event.features[0];
  window.open(feature.properties.url, '_blank');
}

map.on("load", function () {
  map.addSource("places", {
    "type": "geojson",
    "data": "/places.geojson"
  });

  // radius of points larger for mobile
  if (screen && screen.width > 720) {
    var radius = 7;
  } else {
    var radius = 9;
  }

  map.addLayer({
    "id": "place-markers",
    "type": "circle",
    "source": "places",
    "paint": {
      "circle-radius": radius,
      "circle-color": ["get", "taste_color"], 
      "circle-stroke-width": 1,
      "circle-stroke-color": "#000000"
    },
    "filter": ["==", "$type", "Point"]
  });

  map.addLayer({
    "id": "poi-labels",
    "type": "symbol",
    "source": "places",
    'layout': {
      'text-field': ['get', 'name'],
      'text-variable-anchor': ['top'],
      'text-radial-offset': 1,
      'text-justify': 'auto',
      'text-font': ["Open Sans Bold","Arial Unicode MS Regular"],
    },
    'paint':{
      'text-color': ["get", "taste_color"],
      'text-halo-blur': .2,
      'text-halo-width': .8,
      'text-halo-color': "#000000",
    },
    "filter": [">=", ["zoom"], 14]
  });

  // preload thumbnails
  imagePreloader();

  const popup = new maplibregl.Popup({ 
    offset: 8, 
    closeButton: false,
    maxWidth: "12rem",
  });

  function createPopup(event) {
    feature = event.features[0];
    popup
      .setLngLat(feature.geometry.coordinates)
      .setHTML(
        placeHTML(feature.properties)
      )
      .addTo(map);
    
    // Add click handler to popup
    const popupElement = popup.getElement();
    if (popupElement) {
      popupElement.addEventListener('click', () => {
        if (activeFeature && activeFeature.url === feature.url) {
          location.href = feature.properties.url;
          activeFeature = null;
          popup.remove();
        }
      });
    }
    
    // preload image for page
    var img = new Image();
    img.src = feature.properties.food_image_path;
  }

  if (screen && screen.width > 720) {
    map.on("click", "place-markers", placeClickedDesktop);

    // Change the cursor to a pointer when
    // the mouse is over the states layer.
    // Add popup.
    map.on('mouseenter', 'place-markers', (e) => {
      map.getCanvas().style.cursor = 'pointer';
      createPopup(e);
    });
      
    // Change the cursor back to a pointer
    // when it leaves the states layer.
    // Remove popup.
    map.on('mouseleave', 'place-markers', () => {
      map.getCanvas().style.cursor = '';
      popup.remove();
    });
  } else {
    // Mobile logic - first click shows popup, second click opens URL
    let activeFeature = null;

    map.on('click', 'place-markers', (e) => {
      const clickedFeature = e.features[0];
      
      // Use some unique property, for example 'name':
      if (
        activeFeature &&
        activeFeature.properties.name === clickedFeature.properties.name
      ) {
        // Second click on the same marker -> open URL
        location.href = clickedFeature.properties.url;
        activeFeature = null;
        popup.remove();
        return;
      }
      
      // Otherwise, we just opened a new popup
      popup.remove();
      activeFeature = clickedFeature;
      createPopup(e);

      // Also handle clicks on the popup to open the link
      const popupElement = popup.getElement();
      if (popupElement) {
        popupElement.addEventListener('click', () => {
          location.href = clickedFeature.properties.url;
          activeFeature = null;
          popup.remove();
        });
      }
    });


    // Close popup and reset active feature on any map interaction
    map.on('drag', () => {
      popup.remove();
      activeFeature = null;
    });
    map.on('zoom', () => {
      popup.remove(); 
      activeFeature = null;
    });
    map.on('pitch', () => {
      popup.remove();
      activeFeature = null;
    });
    map.on('rotate', () => {
      popup.remove();
      activeFeature = null;
    });
    
    // Close popup and reset when clicking away from markers
    map.on('click', (e) => {
      const features = map.queryRenderedFeatures(e.point, { layers: ['place-markers'] });
      if (!features.length) {
        popup.remove();
        activeFeature = null;
      }
    });
  }

});

function imagePreloader() {
  var images = new Array()
  function preload() {
    for (i = 0; i < preload.arguments.length; i++) {
      images[i] = new Image()
      images[i].src = preload.arguments[i]
    }
  }
  preload(...{{ thumbnails }});
}

</script>
{% endblock %}
