<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{ title }}</title>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  <meta name="theme-color" content="#d44c43" />
  <meta name="title" content="{{ title }}" />
  <meta property="og:title" content="{{ title }}" />
  <meta name="twitter:title" content="{{ title }}" />

  <meta name="description" content="{{ description }}" />
  <meta property="og:description" content="{{ description }}" />
  <meta name="twitter:description" content="{{ description }}" />

  <meta property="og:image" content="{{ SITE_URL }}/vilf_share_image.png" />
  <meta name="twitter:image" content="{{ SITE_URL }}/vilf_share_image.png" />

  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  {% if url %}
  <link rel="canonical" href="{{ SITE_URL }}{{ url }}" />
  <meta property="og:url" content="{{ SITE_URL }}{{ url }}" />
  {% else %}
  <link rel="canonical" href="{{ SITE_URL }}/" />
  <meta property="og:url" content="{{ SITE_URL }}/" />
  {% endif %}

  <link rel="apple-touch-icon" href="{{ SITE_URL }}/favicon.png" />

  <meta name="viewport" content="initial-scale=1,maximum-scale=5,user-scalable=yes" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Lato', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1 {
      font-size: 2em;
    }
    a, a:visited {
      text-decoration: underline;
      text-decoration-style: dotted;
      color: inherit;
    }
    a:hover {
      text-decoration: underline;
      color: inherit;
    }
    h1, h2, h3, .vilf {
      font-family: 'Emilys Candy', 'Brush Script MT', 'Comic Sans MS', cursive;
      font-weight: bold;
    }
    h1, h2, h3 {
      font-weight: bold;
    }
    .left {
      flex-grow: 1;
    }
    .vilf {
      margin: 0;
      color: #fff;
      font-size: 3em;
      font-weight: 400;
      line-height: 1em;
      display: inline-block;
    }
    .social-link {
      color: white;
      font-size: 3em;
      margin-left: 0.5em;
      text-decoration: none;
      display: inline-block;
      vertical-align: baseline;  /* Change to baseline */
      line-height: 0;           /* Change to 0 */
    }
    .social-link:visited {
      color: white;
    }
    .social-link:hover {
      color: black;
    }
    .social-link svg {
      line-height: 1;
      vertical-align: middle;
      width: 0.8em;  
      height: 0.8em;
    }
    @media (max-width: 720px) {
      .social-link, .social-link svg {
        font-size: 1.5em;
      }
    }
    .vilf > a {
      text-decoration: none;
    }
    .subtitle {
      font-size: 1.4em;
      font-family: 'Roboto Slab', 'Times New Roman', Georgia, serif;
      color: #fff;
      margin: 0;
      margin-top: .2em;
      margin-bottom: -.4em;
    }
    .tm {
      font-family: 'Emilys Candy', cursive;
    }
    .header {
      font-size: 1rem;
      padding: 1em;
      display: block;
      margin: 0;
      background: #750395;
      display: flex;
      flex-wrap: wrap;
    }
    .header > .left {
      flex-grow: 1;
    }
    .page-header {
      font-weight: bold;
    }
    .links > a {
      display: inline-block;
      padding: 0.3em 0.4em;
      margin: 0.1em;
      font-size: 1.5em;
      color: #fff;
      font-weight: 700;
      background-color: #ffffff41;
      border-radius: 5px;
      text-decoration: none;
    }
    .links > a:hover {
      background-color: #ffffff9d;
    }
    .links > a.substack-link {
      background-color: #E87D54;
    }
    .links > a.substack-link:hover {
      background-color: #F19474;
    }
    .links {
      margin-bottom: 0;
    }
    @media (max-width: 720px) {
      .header {
        font-size: 0.6rem;
      }
    }
    @media (max-width: 720px) {
      .vilf {
        font-size: 2.5em;
      }
    }
    .name {
      padding: 0;
      margin: 0;
      font-weight: bold;
    }
    .content {
      padding: 1rem;
      max-width: 50rem;
      margin: auto;
    }
    .address {
      margin-top: 0;
      font-size: 1.1em;
      color: #4b4b4b;
    }
    .len-cuisine {
      margin-top: 0em;
      margin-bottom: 1em;
    }
    .cuisine {
      margin-bottom: 0;
    }
    .restaurant-links {
      margin-top: 0;
    }
    .phenomenal {
      color: #2b9aef;
    }
    .good {
      color: #32af2d;
    }
    .sgfi {
      color: #efa72b;
    }
    .dnr {
      color: #ef422b;
    }
    .content-wrapper {
      height: 100%;
    }
    .mono-info {
      padding: 0;
      margin: 0;
      padding-bottom: 0.4em;
      font-family: 'Courier New', Courier, monospace;
    }
    .mono-info-about {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
    }
    .drinks {
      margin-top: 0.6em;
    }
    .list-info {
      margin: 0em;
      padding: 0em;
    }
    .cuisine-list {
      margin-top: 0em;
      margin-bottom: 0em;
      margin-bottom: .5em;
      padding-bottom: .5em;
    }
    .small-date {
      font-style: italic;
      color: #4b4b4b;
      font-size: 1em;
    }
    .first-element {
      margin-top: 2em;
    }
    .blurb {
      font-style: italic;
      color: #4b4b4b;
    }
  </style>
  {% block extra_head %}{% endblock %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Optimized font loading with font-display: swap for better performance -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Emilys+Candy&family=Roboto+Slab&display=swap" rel="stylesheet" media="print" onload="this.media='all'; this.onload=null;">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Emilys+Candy&family=Roboto+Slab&display=swap" rel="stylesheet"></noscript> 
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Z7XL0RM921"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  
  // Defer GA configuration with bounce tracking
  let gaLoaded = false;
  function loadGA() {
    if (!gaLoaded) {
      gtag('js', new Date());
      gtag('config', 'G-Z7XL0RM921');
      gaLoaded = true;
    }
  }
  
  // Load GA on first user interaction
  ['mousedown', 'touchstart', 'keydown', 'scroll'].forEach(event => {
    document.addEventListener(event, loadGA, { once: true, passive: true });
  });
  
  // Track bounces: load GA when user is about to leave
  window.addEventListener('beforeunload', loadGA, { once: true });
  document.addEventListener('visibilitychange', loadGA, { once: true });
  
  // Fallback: load after 1.5 seconds
  setTimeout(loadGA, 1500);
</script>
<body>
  <section class="header">
    <div class="left">
      <span class="vilf"><a href="/">Vegans In Love with Food<span class="tm">&trade;</span></a></span>
      <a href="https://www.instagram.com/VILF_SF/" target="_blank" class="social-link" aria-label="Follow VILF on Instagram">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
        </svg>
      </a>
      <p class="subtitle">A definitive vegan companion to the Bay Area</p>
    </div>
    <div class="right">
      <p class="links">
        <a href="/best/">Best</a>
        <a href="/latest/">Latest</a>
        <a href="/cuisines/">Cuisines</a>
        <a href="/about/">About</a>
        <a href="https://news.vilf.org" target="_blank" class="substack-link">Subscribe</a>
      </p>
    </div>
  </section>
  <div class="content-wrapper">
    {% block content %}
    {% endblock %}
  </div>
</body>
</html>
