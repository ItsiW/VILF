name: Deploy VILF admin
on:
  push:
    branches: develop
permissions:
  contents: read
concurrency:
  group: deploy-admin
  cancel-in-progress: false
env:
  IMAGE: us-west1-docker.pkg.dev/vilf-com/vilf/admin:${{ github.sha }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv python install

      - run: uv sync --locked

      - run: uv run pytest

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.VILF_DEPLOY_KEY }}"

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      - run: docker build -t "$IMAGE" .

      - run: docker run --rm "$IMAGE" python -m scripts.check_image

      - run: docker push "$IMAGE"

      # Only the image changes here. Service account, secrets, env vars, scaling
      # and IAP are owned by infra/admin/setup-admin.sh; do not add flags.
      - run: gcloud run deploy vilf-admin --region us-west1 --image "$IMAGE" --quiet

      # The backup job shares the app's snapshot format and must stay in sync.
      - run: gcloud run jobs update vilf-backup --region us-west1 --image "$IMAGE" --quiet
