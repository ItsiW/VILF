name: Deploy VILF
on:
  push:
    branches: develop
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "1"
      UV_NO_DEV: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so build.py can derive sitemap lastmod from git

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv python install

      - run: uv sync

      - run: ./vilf build

      - uses: google-github-actions/auth@v0
        with:
          credentials_json: "${{ secrets.VILF_CREDS }}"

      - uses: google-github-actions/setup-gcloud@v0

      # -d deletes bucket objects the build no longer produces (removed reviews, old images)
      - run: gsutil -m rsync -R -d build gs://vilf-org

      # gsutil guesses Content-Type from the extension; make the AI-readable files explicit
      - run: |
          gsutil -m setmeta -h 'Content-Type:text/plain; charset=utf-8' gs://vilf-org/llms.txt gs://vilf-org/llms-full.txt
          gsutil -m setmeta -h 'Content-Type:text/markdown; charset=utf-8' 'gs://vilf-org/places/*.md'

      - run: uv run python -m scripts.indexnow
