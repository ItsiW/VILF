name: Test VILF
on:
  pull_request:
    branches: develop
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
