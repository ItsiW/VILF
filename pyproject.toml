[project]
name = "vilf"
version = "0.1.0"
description = "Vegans In Love with Food: static site of vegan restaurant reviews"
requires-python = ">=3.12"
dependencies = [
    # scripts/build.py
    "click>=8.1",
    "jinja2>=3.1",
    "markdown2>=2.5",
    "mdplain>=1.0",
    "pillow>=11",
    "pyyaml>=6",
    "tqdm>=4.66",
    # scripts/spatula.py
    "unidecode>=1.3",
    # scripts/places.py (spatula, check, audit)
    "requests>=2.32",
    "python-dotenv>=1.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.3.5",
    "google-cloud-storage>=3.14.1",
    "google-cloud-compute>=1.52.0",
    "pillow-heif>=1.7.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.15",
]
# scripts/instagram_poster.py + scripts/image_generator.py (run directly, not via ./vilf)
instagram = [
    # scripts/instagram_poster.py still drives Chrome through Selenium
    "selenium>=4.30",
    "webdriver-manager>=4.0",
    "undetected-chromedriver>=3.5",
    "matplotlib>=3.9",
    # undetected-chromedriver imports distutils, gone in 3.12+; setuptools provides the shim
    "setuptools>=70",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["scripts/instagram_poster.py", "scripts/image_generator.py"]

[tool.ruff.lint]
# Catch mistakes without imposing a wholesale formatting rewrite.
select = ["E4", "E9", "F"]
